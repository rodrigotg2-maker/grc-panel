<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E12">
<title>GRC · Panel de avance</title>
<style>html,body{margin:0;background:#0A0E12;color:#8fd3e8;font-family:system-ui,sans-serif}p{padding:24px}</style>
</head>
<body>
<p id="msg">Cargando el panel…</p>
<script>
// Una sola URL: elige la vista de Claude Design según el dispositivo y la carga aquí mismo,
// sin cambiar la dirección (las páginas en /movil y /web no se modifican).
// Forzar una vista: ?vista=movil o ?vista=web
(function () {
  var forzada = new URLSearchParams(location.search).get("vista");
  var ua = navigator.userAgent || "";
  var tactil = window.matchMedia && matchMedia("(pointer: coarse)").matches;
  var pantalla = Math.min(screen.width || 9999, screen.height || 9999);
  var esMovil = /Android|iPhone|iPod|Mobi/i.test(ua) || (tactil && pantalla < 900)
             || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1 && pantalla < 900);
  var vista = forzada === "web" || forzada === "movil" ? forzada : (esMovil ? "movil" : "web");
  fetch(vista + "/index.html?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { location.replace(vista + "/"); });
})();
</script>
</body>
</html>
